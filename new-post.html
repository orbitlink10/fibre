<div class="page-form-screen">
    <div class="page-form-wrap">
        <h1 class="page-form-title">Manage Pages</h1>

        <form class="page-form-card" action="https://fiberopticskenya.co.ke/pages" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="_token" value="NUxIeiQ99fhWMeR43SwbqDsX41Csy3ff4gyabMEU" autocomplete="off">            
            <div class="page-form-card-head">
                <h2>Add New Post</h2>
                <a class="page-form-back" href="https://fiberopticskenya.co.ke/pages">Back</a>
            </div>

            <div class="page-form-body">
                <div class="page-field">
                    <label class="page-label" for="meta_title">Meta Title</label>
                    <input class="page-input" id="meta_title" name="meta_title" value="" placeholder="Enter Meta Title" maxlength="160" required>
                                    </div>

                <div class="page-field">
                    <label class="page-label" for="meta_description">Meta Description</label>
                    <input class="page-input" id="meta_description" name="meta_description" value="" placeholder="Enter Meta Description" maxlength="255">
                                    </div>

                <div class="page-field">
                    <label class="page-label" for="title">Page Title</label>
                    <input class="page-input" id="title" name="title" value="" placeholder="Enter Keyword Title" maxlength="180" required>
                                    </div>

                <div class="page-field">
                    <label class="page-label" for="alt">Image Alt Text</label>
                    <input class="page-input" id="alt" name="alt" value="" placeholder="Enter Image Alt Text" maxlength="160">
                                    </div>

                <div class="page-field">
                    <label class="page-label" for="heading_2">Heading 2</label>
                    <input class="page-input" id="heading_2" name="heading_2" value="" placeholder="Enter Heading 2" maxlength="180">
                                    </div>

                <div class="page-field">
                    <label class="page-label" for="type">Type</label>
                    <select class="page-select" id="type" name="type" required>
                                                    <option value="Post" selected>Post</option>
                                                    <option value="Page" >Page</option>
                                            </select>
                                    </div>

                <div class="page-field">
                    <label class="page-label" for="image">Image</label>
                    <input class="page-input" id="image" name="image" type="file" accept="image/*">
                                    </div>

                <div class="page-field">
                    <label class="page-label" for="description">Page Description:</label>
                    <textarea class="page-textarea" id="description" name="description"></textarea>
                                    </div>

                <div class="page-actions">
                    <button class="page-save" type="submit">Save</button>
                    <a class="page-cancel" href="https://fiberopticskenya.co.ke/pages">Cancel</a>
                </div>
            </div>
        </form>

<script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js" referrerpolicy="origin"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (!window.tinymce) {
            return;
        }

        tinymce.init({
            selector: '#description',
            menubar: 'file edit view insert format tools table',
            plugins: 'link image media table code fullscreen lists advlist autolink',
            toolbar: 'undo redo | blocks | bold italic | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | link image media | code fullscreen',
            block_formats: 'Paragraph=p; Heading 1=h1; Heading 2=h2; Heading 3=h3; Heading 4=h4',
            height: 430,
            branding: false,
            promotion: false,
            content_style: "body { font-family: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 16px; font-weight: 400; color: #495057; }"
        });
    });
